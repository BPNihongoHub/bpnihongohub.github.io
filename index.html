<style>
/* Binod Paudel site v6: midnight aurora + ink-drawn hanko. Indigo→crimson gradient brand, glass surfaces, kanji-glyph navigation. */
:root{
  --bg:#f3f5ff; --paper:#ffffff; --ink:#0a1440; --muted:#46507a; --line:#dde2f5;
  --ai:#2443e8; --ai-soft:#e6ebff; --shu:#e5193f; --shu-soft:#ffe6eb; --ok:#0a9a5c; --ok-soft:#dcf5e9;
  --gold:#e3a200; --shadow:0 1px 2px rgba(10,20,64,.06),0 12px 32px rgba(36,67,232,.10);
  --grad:linear-gradient(125deg,#0a1a52 0%,#2443e8 52%,#e5193f 100%);
  --f-disp:'Plus Jakarta Sans','Zen Maru Gothic','Noto Sans JP','Noto Sans Devanagari','Noto Sans Myanmar',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Noto Sans JP','Noto Sans Devanagari','Noto Sans Myanmar',system-ui,sans-serif;
  --f-jp:'Zen Maru Gothic','Noto Sans JP',sans-serif;
}
/* Dark Aurora theme (default, Binod 2026-11-25) */
:root:not([data-theme="light"]){
  --bg:#0b0d1a; --paper:#161a33; --ink:#f4f5ff; --muted:#b0b4d6; --line:rgba(255,255,255,.13);
  --ai:#9a8cff; --ai-soft:rgba(139,123,255,.18); --shu:#ff5c97; --shu-soft:rgba(255,77,141,.16); --ok:#3ee6a0; --ok-soft:rgba(62,230,160,.14);
  --gold:#ffd23f; --shadow:0 10px 40px rgba(0,0,0,.45); --grad:linear-gradient(120deg,#7b5cff 0%,#ff4d8d 55%,#ffb03f 100%);
  --f-disp:'Space Grotesk','Zen Maru Gothic','Noto Sans JP','Noto Sans Devanagari','Noto Sans Myanmar',system-ui,sans-serif;
  --f-body:'Space Grotesk','Noto Sans JP','Noto Sans Devanagari','Noto Sans Myanmar',system-ui,sans-serif; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 520px at 100% -10%,rgba(255,196,61,.22),transparent 60%),radial-gradient(800px 600px at -10% 35%,rgba(36,67,232,.10),transparent 60%),radial-gradient(700px 500px at 110% 85%,rgba(229,25,63,.08),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px;border-radius:8px}
.wrap{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;text-wrap:balance;line-height:1.25;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
a.card{text-decoration:none;color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font:800 10px/1.6 var(--f-body);letter-spacing:.06em;padding:0 6px;border-radius:6px;background:var(--ai-soft);color:var(--ai);margin-right:6px;vertical-align:2px}

/* hanko (drawn 楽) */
svg.hk rect{fill:var(--shu)} svg.hk path{fill:none;stroke:#fff;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--ai);color:#fff;font-family:var(--f-disp);font-size:15px;text-decoration:none;display:inline-block;text-align:center;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(61,61,245,.25)}
.btn:active{transform:none}
.btn.grad{background:linear-gradient(120deg,#3527c9,#e81f55)}
.btn.red{background:var(--shu)}
.btn.ghost{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.btn.light{background:#fff;color:#14104a}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.on{border-color:transparent;background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
select{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px}
select.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
select.glass option{color:#111}
.linkbtn{border:0;background:none;color:var(--ai);font-weight:800;text-decoration:underline;padding:0}
.langsel{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:0 4px 0 10px;background:var(--paper);font-size:13px}
.langsel select{border:0;background:transparent;padding:6px 4px;font-weight:700;max-width:150px}

/* header */
header.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top .in{max-width:1020px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit;min-width:0}
.brand svg.hk{width:42px;height:42px;flex:none;transform:rotate(-5deg)}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:17px;display:block;line-height:1.1;white-space:nowrap}
.brand b em{font-style:normal;color:var(--shu)}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.brand small strong{color:var(--ink);font-size:13.5px;font-weight:800;letter-spacing:.1em}
.tools{display:flex;gap:6px;align-items:center}
nav.tabs{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
nav.tabs a i{font:900 13px/1 var(--f-jp);font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--ai-soft);color:var(--ai)}
nav.tabs a.on{background:var(--ink);color:var(--paper)}
nav.tabs a.on i{background:linear-gradient(135deg,#3527c9,#e81f55);color:#fff}
nav.bnav{display:none}
@media (max-width:760px){
  nav.tabs{display:none}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  nav.bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:8;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  nav.bnav a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:700;padding:2px 0;min-width:0}
  nav.bnav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.bnav a i{font:900 17px/1 var(--f-jp);font-style:normal;width:36px;height:30px;border-radius:11px;display:grid;place-items:center;transition:background .2s}
  nav.bnav a.on{color:var(--ink)}
  nav.bnav a.on i{background:linear-gradient(135deg,#3527c9,#e81f55);color:#fff;box-shadow:0 6px 14px rgba(232,31,85,.3)}
  .brand small{font-size:10px}.brand small strong{font-size:12px}
  .langsel select{max-width:96px}
}
.foot-note{padding-block:6px 30px;font-size:12px;color:var(--muted);text-align:center}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:#06071a;color:#fff;overflow:hidden;display:grid;place-items:center;transition:opacity .7s,transform .7s;padding:24px 16px}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.aur{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:aur 16s ease-in-out infinite alternate;pointer-events:none}
.aur.a1{background:#3527c9;left:-20vmax;top:-24vmax}
.aur.a2{background:#e81f55;right:-24vmax;bottom:-26vmax;animation-delay:-6s}
.aur.a3{background:#0ab4ff;left:30%;top:40%;width:34vmax;height:34vmax;opacity:.25;animation-delay:-11s}
@keyframes aur{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%)}
.sp-kana{position:absolute;inset:0;pointer-events:none}
.sp-kana i{position:absolute;top:105%;font-style:normal;font-family:var(--f-jp);font-weight:900;color:rgba(255,255,255,.07);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(25deg)}}
.sp-in{position:relative;text-align:center;max-width:680px}
.sp-hk{width:118px;height:118px;display:block;margin:0 auto 18px;filter:drop-shadow(0 18px 40px rgba(232,31,85,.45));animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.sp-hk:not(.bplogo) rect{fill:#e81f55}
.sp-hk:not(.bplogo) path{fill:none;stroke:#fff;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:130;stroke-dashoffset:130;animation:ink .32s ease-out forwards;animation-delay:calc(.45s + var(--i) * .11s)}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.sp-school{font-weight:800;font-size:clamp(14px,3.8vw,21px);letter-spacing:.42em;margin-right:-.42em}
.sp-school span{display:inline-block;opacity:0;animation:up .6s ease-out forwards}
.sp-school span:nth-child(1){animation-delay:1.6s}.sp-school span:nth-child(2){animation-delay:1.75s}.sp-school span:nth-child(3){animation-delay:1.9s;color:#ff6b93}
.sp-jp{font:900 clamp(24px,6vw,38px)/1.3 var(--f-jp);margin-top:4px;opacity:0;animation:up .6s 2s ease-out forwards}
.sp-with{margin-top:14px;font-size:12px;letter-spacing:.4em;text-transform:uppercase;opacity:0;animation:up .6s 2.15s ease-out forwards}
.sp-name{font-weight:800;font-size:clamp(38px,10vw,80px);line-height:1.05;letter-spacing:.05em;background:linear-gradient(90deg,#fff 0%,#ffd166 30%,#ff6b93 55%,#fff 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:up .7s 2.25s ease-out forwards,shine 4s 2.4s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.sp-tag{margin-top:10px;opacity:0;animation:up .6s 2.45s ease-out forwards;color:rgba(255,255,255,.82);font-size:15px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-langs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px;opacity:0;animation:up .6s 2.6s ease-out forwards}
.sp-langs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.sp-langs button.on{background:#fff;color:#14104a;border-color:#fff}
.sp-go{margin-top:18px;background:linear-gradient(120deg,#3527c9,#e81f55);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-weight:800;font-size:16px;opacity:0;animation:up .6s 2.75s ease-out forwards;box-shadow:0 12px 30px rgba(232,31,85,.35)}
.sp-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3527c9,#e81f55);animation:bar 7s linear forwards}
#splash.pick .sp-bar{display:none}
@keyframes bar{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.sp-kana{display:none}.aur{animation:none}}

/* login */
.loginwrap{position:relative;min-height:100vh;min-height:100dvh;background:#06071a;overflow:hidden;display:grid;place-items:center;padding:70px 16px 40px;color:#fff}
.lg-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:2}
.loginwrap .langsel{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.loginwrap .langsel option{color:#111}
.login{position:relative;width:min(440px,100%);padding:30px 26px;background:rgba(19,21,43,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;text-align:left}
.login svg.hk{width:78px;height:78px;display:block;margin:0 auto 12px;transform:rotate(-6deg)}
.lg-school{text-align:center;font-weight:800;letter-spacing:.3em;font-size:14px;margin-right:-.3em}
.lg-school b{color:#ff6b93}
.lg-jp{text-align:center;font:900 24px/1.3 var(--f-jp)}
.lg-name{text-align:center;font-weight:800;font-size:clamp(28px,8vw,36px);letter-spacing:.06em;margin:6px 0 20px;background:linear-gradient(90deg,#fff,#ffd166,#ff6b93);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-name small{display:block;font-size:11px;letter-spacing:.4em;color:rgba(255,255,255,.65);-webkit-text-fill-color:rgba(255,255,255,.65)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px}
.login .field label{color:rgba(255,255,255,.75)}
.login .field input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff}
.login .note{color:rgba(255,255,255,.7)}
.err{color:var(--shu);font-size:14px;min-height:22px}
.login .err{color:#ff8fae}

/* home */
.hero2{position:relative;overflow:hidden;margin-top:18px;border-radius:28px;padding:26px 24px;background:var(--grad);color:#fff;display:grid;grid-template-columns:1.5fr 1fr;gap:18px 20px;align-items:center;box-shadow:0 20px 50px rgba(53,39,201,.25)}
.hero2::after{content:"日";position:absolute;right:-30px;bottom:-110px;font:900 300px/1 var(--f-jp);color:rgba(255,255,255,.07);pointer-events:none}
.hero2>*{position:relative;z-index:1}
.h-hello{font-size:15px;opacity:.9}
.h-eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.8;margin-top:6px}
.hero2 h1{font-size:clamp(24px,4.4vw,36px);margin-top:4px}
.hero2 p{margin:8px 0 0;opacity:.88}
.h-r{display:grid;justify-items:center;gap:4px}
.ring{width:150px;height:150px}
.ring-n{font-family:var(--f-disp);font-weight:800;font-size:26px;fill:#fff}
.ring-l{font-size:11px;fill:rgba(255,255,255,.75)}
.h-rl{font-size:13px;opacity:.9;text-align:center}
.h-teacher{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:12px 16px;backdrop-filter:blur(6px)}
.h-teacher svg.hk{width:46px;height:46px;flex:none;transform:rotate(-6deg)}
.h-teacher svg.hk rect{fill:#fff}.h-teacher svg.hk path{stroke:#e81f55}
.h-teacher small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.h-teacher b{display:block;font-weight:800;font-size:clamp(22px,4.8vw,30px);letter-spacing:.1em;line-height:1.15}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{padding:16px;position:relative;overflow:hidden}
.stat i{position:absolute;right:10px;top:4px;font:900 40px/1 var(--f-jp);font-style:normal;color:var(--ai);opacity:.1}
.stat b{font-family:var(--f-disp);font-weight:800;font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.wotd{background:linear-gradient(140deg,#14104a,#3527c9);color:#fff;border:0;padding:20px;position:relative}
.wotd .w{font:900 38px/1.15 var(--f-jp);margin-top:4px}
.wotd .r{opacity:.8}
.wotd .eyebrow{color:rgba(255,255,255,.7)}
.wotd .mn{margin-top:4px}
.wotd .tag{background:rgba(255,255,255,.18);color:#fff}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.speak.inv{background:transparent;color:inherit;border-color:rgba(255,255,255,.5)}
.srsbox{padding:20px;display:grid;gap:4px;align-content:center}
.srsbox b{font-family:var(--f-disp);font-weight:800;font-size:46px;line-height:1;background:linear-gradient(120deg,#3527c9,#e81f55);-webkit-background-clip:text;background-clip:text;color:transparent}
.paths{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.path{padding:20px;display:grid;gap:10px;align-content:start}
.path .kana{font-size:12px;color:var(--shu);font-weight:800;letter-spacing:.12em}
.path h2{font-size:22px}

function sha256js(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let res='',words=[],bl=ascii.length*8,hash=[],k=[],pc=0,ic={};for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}hash=hash.slice(0,8);ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((bl/mw)|0);words[words.length]=(bl);for(let j=0;j<words.length;){const w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];const t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);const t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(let i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

async function unlock(code,silent,nosave){const cx=DX,K=KEYS;

  if(code.length!==12||!w){if(silent&&K)LS.set(codeKey(cx),'');return false}
  let mk;

    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(w[0]),iterations:K.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);

    mk=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);MKC[cx]=mk;if(DX===cx)window.MK=mk}
  catch(e){if(silent)LS.set(codeKey(cx),'');return false}
  try{const L=await fetch(cx==='n3'?'locked.json':'locked-'+cx+'.json').then(r=>r.json());
    const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(L.iv)},mk,b64d(L.ct));

    if(DX!==cx){const c=DC[cx];if(c&&!c.UNL){c.D.q=c.D.q.concat(B.q);c.D.w=c.D.w.concat(B.w);c.LX=B.ex;c.UNL=true}}

  catch(e){return false}
}

/* encrypted strips (.bin = 12-byte IV + AES-GCM ciphertext, same course key as locked sets) */
async function decStrip(src){const buf=new Uint8Array(await fetch(src).then(r=>r.arrayBuffer()));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},window.MK,buf.slice(12));return URL.createObjectURL(new Blob([pt],{type:'image/jpeg'}))}

async function beKey(){/* paid account: fetch the course unlock code (readable only by paid users) and open locked sets */
  const cx=DX;if(MKC[cx])return;try{const c=await BE.api.key(cx);if(c&&DX===cx)await unlock(c,true,true)}catch(e){}}/* not saved locally: access ends when the 6 months end */
let _syncT=0,_stT=0,_stReady=false;
/* full study progress backup in the account (users/{uid}/st/main), so a new phone gets the same results */
const stSkip=k=>/^rk_(auth|bemock|blk|payseen|lang_ok|theme|splash)$|code|key|^rk_stbar_/i.test(k);
function stDump(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('rk_')&&!stSkip(k))o[k]=localStorage.getItem(k)}return JSON.stringify(o)}
function stMerge(js){let o;try{o=JSON.parse(js)}catch(e){return false}let ch=false;
  for(const [k,cv] of Object.entries(o)){if(stSkip(k)||!k.startsWith('rk_'))continue;const lv=localStorage.getItem(k);let nv=cv;
    if(lv!=null){try{const a=JSON.parse(cv),b=JSON.parse(lv);
      if(Array.isArray(a)&&Array.isArray(b))nv=JSON.stringify([...new Set(a.concat(b))]);
      else if(a&&b&&typeof a==='object'&&typeof b==='object')nv=JSON.stringify(Object.assign({},a,b));
      else nv=lv}catch(e){nv=lv}}
    if(nv!==lv){try{localStorage.setItem(k,nv);ch=true}catch(e){}}}
  return ch}
async function stPull(){if(!BE.api.stGet||!BE.user)return;try{const c=await BE.api.stGet(BE.user.uid);_stReady=true;
    if(c&&c.v&&stMerge(c.v)&&!sessionStorage.getItem('stpulled')){sessionStorage.setItem('stpulled','1');stPush(true);setTimeout(()=>location.reload(),300);return}
    stPush(true)}catch(e){_stReady=true}}
function stPush(force){if(!_stReady||!BE.api.stPut||!BE.user)return;const now=Date.now();if(!force&&now-_stT<120000)return;_stT=now;
  const v=stDump();if(v.length<900000)BE.api.stPut(BE.user.uid,v).catch(()=>{})}
function beSync(force){/* push a small progress summary, at most once a minute */
  if(!BE.ok||!BE.user)return;const now=Date.now();if(!force&&now-_syncT<60000)return;_syncT=now;
  const res=P.res,vals=Object.values(res),ures=LS.get('ures',{});
  const sum={done:vals.length,ok:vals.filter(v=>v===1).length,days:(P.days||[]).length,hw:Object.fromEntries(Object.entries(ures).map(([k,v])=>[k,v.b||0]))};
  BE.api.progress(BE.user.uid,sum).catch(()=>{});stPush(force);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beSync(true)});

function fbApi(){

    review:(uid,o)=>F.doc('reviews/'+uid).set(Object.assign({uid,show:false,created:TS()},o)),

async function openCert(course,detail){
  const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="sheet card"><button class="iconbtn close" aria-label="${t('close')}">✕</button><div class="eyebrow">${t('certT')}</div>
  <div class="field" style="margin-top:12px"><label for="cname">${t('certName')}</label><input id="cname" value="${esc(LS.get('cname',''))}" placeholder="Your name"></div>
  <button class="btn" id="cmake">${t('certMake')}</button><div id="cout"></div></div>`;
  document.body.appendChild(m);const close=()=>m.parentNode&&m.parentNode.removeChild(m);m.onclick=e=>{if(e.target===m)close()};m.querySelector('.close').onclick=close;
  m.querySelector('#cmake').onclick=async()=>{const name=m.querySelector('#cname').value.trim()||'Student';LS.set('cname',name);
    try{await document.fonts.load('900 40px "Zen Maru Gothic"');await document.fonts.load('40px "Kaushan Script"')}catch(e){}
    const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fbfaf6';x.fillRect(0,0,W,H);
    x.strokeStyle='#1f3f7a';x.lineWidth=18;x.strokeRect(30,30,W-60,H-60);x.strokeStyle='#c98a00';x.lineWidth=3;x.strokeRect(60,60,W-120,H-120);
    x.strokeStyle='rgba(31,63,122,.12)';x.lineWidth=2;for(let yy=H-70,r=0;yy>H-260;yy-=22,r++)for(let xx=70;xx<420;xx+=44)for(let q=1;q<=3;q++){x.beginPath();x.arc(xx+(r%2?22:0),yy,q*7,Math.PI,0);x.stroke()}
    x.textAlign='center';x.fillStyle='#d7263d';x.font='900 40px "Zen Maru Gothic"';x.fillText('修了証書',W/2,170);
    x.fillStyle='#16233f';x.font='900 74px "Zen Maru Gothic"';x.fillText('CERTIFICATE',W/2,260);
    x.font='600 26px "Noto Sans JP"';x.fillStyle='#5d6a85';x.fillText('BINOD PAUDEL · 日本語',W/2,310);
    x.font='26px "Noto Sans JP"';x.fillText('This certifies that',W/2,400);
    x.fillStyle='#1f3f7a';x.font='900 80px "Zen Maru Gothic","Noto Sans Devanagari","Noto Sans Myanmar"';x.fillText(name,W/2,500);
    x.strokeStyle='#c98a00';x.lineWidth=2;x.beginPath();x.moveTo(400,525);x.lineTo(W-400,525);x.stroke();
    x.fillStyle='#16233f';x.font='28px "Noto Sans JP"';x.fillText('has successfully completed',W/2,590);
    x.font='700 40px "Noto Sans JP","Noto Sans Devanagari"';x.fillText(course,W/2,650);
    x.font='600 30px "Noto Sans JP"';x.fillStyle='#d7263d';x.fillText(detail,W/2,705);
    const d=new Date();x.fillStyle='#5d6a85';x.font='24px "Noto Sans JP"';x.textAlign='left';x.fillText('Date: '+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(),180,900);
    x.textAlign='center';x.fillStyle='#16233f';x.font='64px "Kaushan Script"';x.fillText('Binod Paudel',W-420,880);
    x.strokeStyle='#16233f';x.lineWidth=2;x.beginPath();x.moveTo(W-620,905);x.lineTo(W-220,905);x.stroke();
    x.font='600 22px "Noto Sans JP"';x.fillStyle='#5d6a85';x.fillText('BINOD PAUDEL · Japanese Teacher',W-420,940);
    x.save();x.translate(W/2,900);x.rotate(-.12);x.strokeStyle='#d7263d';x.lineWidth=7;x.beginPath();x.arc(0,0,78,0,7);x.stroke();x.fillStyle='#d7263d';x.font='900 92px "Zen Maru Gothic"';x.textBaseline='middle';x.fillText('師',0,6);x.restore();
    const url=c.toDataURL('image/png');const out=m.querySelector('#cout');
    out.innerHTML=`<img class="certimg" alt="Certificate" src="${url}"><p class="note">${t('certHint')}</p><button class="btn ghost" id="csave">${t('save')}</button>`;
    out.querySelector('#csave').onclick=async()=>{try{const dl=window.claude&&await claude.use('downloads');if(!dl)throw 0;const b=await (await fetch(url)).blob();await dl.save({filename:'Binod-Paudel-Certificate.png',data:b})}catch(e){toast(t('lp'))}};
  };
}
